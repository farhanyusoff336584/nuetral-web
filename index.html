<!DOCTYPE html>

    <title>Farhan's Page</title>

            margin: 40px;
            background: #f5f5f5;
            color: #222;
        }
        h1 {
            text-align: center;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 24px 20px 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        img {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 16px auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background: #f0f0f0;
        }
        .caption {
            text-align: center;
            font-size: 0.95em;
            color: #555;
            margin-top: 6px;
        }
    </style>
</head>
